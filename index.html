<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Updates Dashboard — Próspera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Playfair+Display:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <img class="logo-img" src="logo.png" alt="Próspera" />
        <div class="header-divider"></div>
        <div class="header-titles">
          <h1>Team Updates Dashboard</h1>
          <div class="subtitle">Executive Summary &mdash; All Departments</div>
        </div>
      </div>

      <nav class="header-route-nav" id="header-route-nav" aria-label="Primary navigation"></nav>

      <div class="header-right">
        <div id="csv-badge" class="data-badge loading">
          <span class="dot"></span>
          <span id="csv-date-label">Loading…</span>
          <button class="refresh-btn" id="refresh-btn" title="Refresh data">↻</button>
        </div>
        <div class="viewed-date" id="viewed-date"></div>
      </div>
    </header>

    <main aria-label="Dashboard content">
      <div id="state-box" class="state-box">
        <div class="state-icon">⏳</div>
        <p id="state-msg">Fetching latest data from Google Sheets…</p>
      </div>

      <div
        class="summary-grid"
        id="summary"
        data-hook="summary"
        role="region"
        aria-label="Summary statistics"
        aria-live="polite"
        style="display: none"
      ></div>

      <div class="goals-section" id="goals-section" data-hook="goal-cards" style="display: none">
        <h2>Progress by Goal</h2>
        <div class="goals-grid" id="goals-grid" data-hook="goals-grid"></div>
      </div>

      <section
        id="blocked-section"
        class="blocked-section"
        data-hook="blocked-section"
        style="display: none"
      ></section>

      <section
        id="recent-activity"
        class="recent-activity"
        data-hook="recent-activity"
        style="display: none"
      >
        <h2 class="recent-activity-heading">Recent Activity</h2>
        <div class="recent-activity-list" id="recent-activity-list"></div>
      </section>

      <div class="controls" id="controls" data-hook="controls" style="display: none">
        <div class="search-bar">
          <input
            type="text"
            id="search"
            placeholder="Search updates…"
            aria-label="Search updates"
          />
          <button
            class="filter-toggle"
            id="filter-toggle"
            type="button"
            aria-expanded="false"
            aria-label="Toggle filter panel"
          >
            Filters
            <span class="filter-badge" id="filter-badge"></span>
          </button>
          <button class="reset-btn" id="reset-btn" aria-label="Reset all filters">Reset</button>
        </div>
        <div class="filter-panel" id="filter-panel">
          <div class="filter-panel-inner">
            <div class="control-group">
              <label for="filter-dept">Department</label>
              <select id="filter-dept">
                <option value="">All</option>
              </select>
            </div>
            <div class="control-group">
              <label for="filter-team">Team</label>
              <select id="filter-team">
                <option value="">All</option>
              </select>
            </div>
            <div class="control-group">
              <label for="filter-person">Responsible</label>
              <select id="filter-person">
                <option value="">All</option>
              </select>
            </div>
            <div class="control-group">
              <label for="filter-status">Status</label>
              <select id="filter-status">
                <option value="">All</option>
              </select>
            </div>
            <div class="control-group">
              <label for="filter-goal">Goal</label>
              <select id="filter-goal">
                <option value="">All</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div
        class="result-count"
        id="result-count"
        data-hook="result-count"
        aria-live="polite"
        style="display: none"
      ></div>

      <div
        class="scoped-summary"
        id="scoped-summary"
        data-hook="scoped-summary"
        style="display: none"
        role="region"
        aria-label="Filtered summary statistics"
        aria-live="polite"
      ></div>

      <div class="table-wrap" id="table-wrap" data-hook="detail-table" style="display: none">
        <table>
          <thead>
            <tr>
              <th
                scope="col"
                data-sort-key="Responsible"
                aria-sort="none"
                role="columnheader"
                tabindex="0"
              >
                Responsible
              </th>
              <th
                scope="col"
                data-sort-key="Topic"
                aria-sort="none"
                role="columnheader"
                tabindex="0"
              >
                Topic
              </th>
              <th
                scope="col"
                data-sort-key="Status"
                aria-sort="none"
                role="columnheader"
                tabindex="0"
              >
                Status
              </th>
              <th
                scope="col"
                data-sort-key="Goal"
                aria-sort="none"
                role="columnheader"
                tabindex="0"
              >
                Goal
              </th>
              <th
                scope="col"
                data-sort-key="Added/updated"
                aria-sort="none"
                role="columnheader"
                tabindex="0"
              >
                Updated
              </th>
            </tr>
          </thead>
          <tbody id="table-body" data-hook="table-body"></tbody>
        </table>
      </div>

      <div
        id="drilldown-view"
        class="drilldown-view"
        style="display: none"
        role="region"
        aria-label="Drilldown view"
      >
        <nav class="drilldown-breadcrumb" aria-label="Breadcrumb">
          <ol class="drilldown-breadcrumb-list" id="drilldown-breadcrumb-list"></ol>
        </nav>

        <div class="drilldown-header" id="drilldown-header">
          <h2 class="drilldown-title" id="drilldown-title"></h2>
          <div class="drilldown-subtitle" id="drilldown-subtitle"></div>
        </div>

        <div
          class="drilldown-hero"
          id="drilldown-hero"
          role="region"
          aria-label="Drilldown summary"
        ></div>

        <div class="drilldown-trend-panel" id="drilldown-trend-panel" style="display: none"></div>

        <div
          class="drilldown-filters"
          id="drilldown-filters"
          role="search"
          aria-label="Filter this view"
        ></div>

        <div class="drilldown-result-count" id="drilldown-result-count"></div>

        <div class="drilldown-table-wrap" id="drilldown-table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Responsible</th>
                <th scope="col">Topic</th>
                <th scope="col">Status</th>
                <th scope="col">Goal</th>
                <th scope="col">Updated</th>
              </tr>
            </thead>
            <tbody id="drilldown-table-body"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/frappe-charts@2.0.1/dist/frappe-charts.umd.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
